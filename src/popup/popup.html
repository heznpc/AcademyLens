<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AcademyLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="../../assets/icons/icon48.png" alt="" />
          <strong>AcademyLens</strong>
        </div>
        <span>Unofficial</span>
      </header>
      <p data-i18n="popup.description">Translate OpenAI Academy course content in your language.</p>
      <label>
        <span data-i18n="field.targetLanguage">Target language</span>
        <select id="targetLanguage"></select>
      </label>
      <p class="hint" id="languageSupport"></p>
      <label>
        <span data-i18n="field.translationEngine">Translation engine</span>
        <select id="translationEngine"></select>
      </label>
      <p class="hint" id="engineNote"></p>
      <section id="cloudConnection" hidden aria-label="AI connection">
        <label id="apiEndpointField">
          <span data-i18n="connection.endpoint">HTTPS chat completions endpoint</span>
          <input id="apiEndpoint" type="url" autocomplete="off" spellcheck="false" placeholder="https://provider.example/v1/chat/completions" />
        </label>
        <label>
          <span data-i18n="connection.model">Model ID</span>
          <input id="cloudModel" type="text" autocomplete="off" spellcheck="false" maxlength="120" />
        </label>
        <label>
          <span data-i18n="connection.secret">API key / Puter auth token</span>
          <input id="cloudSecret" type="password" autocomplete="off" spellcheck="false" />
        </label>
        <p class="hint" data-i18n="connection.note"></p>
        <a id="puterHelp" href="https://docs.puter.com/Auth/signIn/" target="_blank" rel="noopener noreferrer" data-i18n="connection.puterHelp" hidden>Puter authentication documentation</a>
        <div class="connection-actions">
          <button id="saveConnection" type="button" data-i18n="connection.save">Save connection</button>
          <button id="clearConnection" type="button" data-i18n="connection.clear">Forget credentials</button>
        </div>
        <p id="connectionStatus" role="status" aria-live="polite"></p>
      </section>
      <label id="ollamaModelField" hidden>
        <span data-i18n="field.ollamaModel">Ollama model</span>
        <select id="ollamaModel"></select>
      </label>
      <div id="ollamaHealth" class="ollama-health" hidden>
        <p class="hint" id="ollamaStatus" aria-live="polite"></p>
        <button id="ollamaRetry" type="button" data-i18n="ollama.checkAgain">Check again</button>
      </div>
      <label class="toggle">
        <input id="autoTranslate" type="checkbox" />
        <span data-i18n="popup.autoTranslate">Auto-translate new course text</span>
      </label>
      <label class="toggle">
        <input id="nativeDownloads" type="checkbox" />
        <span data-i18n="popup.nativeDownloads">Allow built-in translation and explanation model downloads</span>
      </label>
      <p class="notice" data-i18n="notice.unofficial">Unofficial, not affiliated with OpenAI.</p>
    </main>
    <script src="../lib/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
